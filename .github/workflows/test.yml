name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Lint with ruff
        run: ruff check backend llm pipeline analytics tests

      - name: Check formatting with ruff
        run: ruff format --check backend llm pipeline analytics tests

      - name: Run tests
        run: pytest -q
