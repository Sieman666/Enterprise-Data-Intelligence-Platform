name: ETL Pipeline

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  pull_request:

jobs:
  etl:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: enterprise_user
          POSTGRES_PASSWORD: enterprise_password
          POSTGRES_DB: enterprise_dw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Generate sample data
        run: python data/sample/generate_sample_data.py

      - name: Initialize database
        working-directory: backend
        env:
          DATABASE_URL: postgresql://enterprise_user:enterprise_password@localhost:5432/enterprise_dw
          READONLY_DATABASE_URL: postgresql://enterprise_readonly:enterprise_readonly_password@localhost:5432/enterprise_dw
        run: python -m app.database.init_db

      - name: Run ETL pipeline
        env:
          DATABASE_URL: postgresql://enterprise_user:enterprise_password@localhost:5432/enterprise_dw
        run: python -m pipeline.run_etl --replace
